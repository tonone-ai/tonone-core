name: Sync from tonone

# This repository is generated. Its source of truth is bundle/tonone-core in
# https://github.com/tonone-ai/tonone. Edit there; this job copies it here.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tonone-ai/tonone
          path: .upstream
      - name: Copy bundle
        run: |
          rsync -a --delete \
            --exclude .git --exclude .github --exclude .upstream --exclude icon.png \
            .upstream/bundle/tonone-core/ ./
          cp .upstream/assets/icon.png icon.png
          rm -rf .upstream
      - name: Commit if changed
        run: |
          git config user.name "tonone-sync"
          git config user.email "hello@tonone.ai"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "sync: bundle/tonone-core from tonone-ai/tonone"
          git push
